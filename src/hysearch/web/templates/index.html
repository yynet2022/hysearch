<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hysearch - Local Hybrid Search</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-bg: #eff6ff;
      --badge-bm25: #0369a1;
      --badge-vec: #6d28d9;
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --highlight-bg: #fef08a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    header span {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 12px 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .status-item {
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .status-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .status-value {
      font-size: 0.95rem;
      font-weight: 600;
      word-break: break-all;
    }
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .search-input {
      flex: 1;
      padding: 10px 14px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .params-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }
    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }
    .error-box {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .hit-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .hit-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .hit-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      word-break: break-all;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.78rem;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .badge-bm25 { color: var(--badge-bm25); }
    .badge-vec { color: var(--badge-vec); }
    .hit-content {
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 8px;
    }
    mark {
      background-color: var(--highlight-bg);
      padding: 0 2px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>hysearch</h1>
      <span>Local Hybrid Search Engine (SQLite FTS5 + sqlite-vec)</span>
    </header>

    <section class="card" id="status-section">
      <h2 class="card-title">Index Status</h2>
      <div class="status-grid" id="status-grid">
        <div class="status-item">
          <div class="status-label">Status</div>
          <div class="status-value">Loading...</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Search Query</h2>
      <form id="search-form">
        <div class="search-row">
          <input
            type="text"
            id="q-input"
            class="search-input"
            placeholder="Enter search keywords or natural language query..."
            required
            autofocus
          />
          <button type="submit" class="btn-primary" id="search-btn">Search</button>
        </div>

        <div class="params-grid">
          <div class="field">
            <label for="mode-select">Mode</label>
            <select id="mode-select">
              <option value="hybrid" selected>hybrid (BM25 + Vec)</option>
              <option value="bm25">bm25 (Keyword)</option>
              <option value="vector">vector (Semantic)</option>
            </select>
          </div>
          <div class="field">
            <label for="top-input">Top K</label>
            <input type="number" id="top-input" value="5" min="1" max="100" />
          </div>
          <div class="field">
            <label for="rrf-input">RRF K</label>
            <input type="number" id="rrf-input" value="60" min="1" max="500" />
          </div>
          <div class="field">
            <label for="path-input">Path Filter (--path)</label>
            <input type="text" id="path-input" placeholder="e.g. ./docs or src/" />
          </div>
          <div class="field">
            <label for="glob-input">Glob Filter (--glob)</label>
            <input type="text" id="glob-input" placeholder="e.g. *.md or **/*.py" />
          </div>
          <div class="field">
            <label for="since-input">Since (--since)</label>
            <input type="text" id="since-input" placeholder="YYYY-MM-DD" />
          </div>
          <div class="field">
            <label for="until-input">Until (--until)</label>
            <input type="text" id="until-input" placeholder="YYYY-MM-DD" />
          </div>
        </div>
      </form>
    </section>

    <div id="error-box" class="error-box"></div>

    <section id="results-section" style="display: none;">
      <div class="results-meta" id="results-meta"></div>
      <div id="results-list"></div>
    </section>
  </div>

  <script>
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function highlightTerms(text, query) {
      const escaped = escapeHtml(text);
      if (!query || !query.trim()) return escaped;
      const terms = query.trim().split(/\s+/).filter(Boolean);
      let result = escaped;
      for (const term of terms) {
        const safeTerm = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        if (!safeTerm) continue;
        const regex = new RegExp(`(${safeTerm})`, "gi");
        result = result.replace(regex, "<mark>$1</mark>");
      }
      return result;
    }

    async function loadStatus() {
      const grid = document.getElementById("status-grid");
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        if (!res.ok) {
          grid.innerHTML = `<div class="status-item"><div class="status-value">${escapeHtml(data.detail || "Failed to load status")}</div></div>`;
          return;
        }
        grid.innerHTML = Object.entries(data).map(([k, v]) => `
          <div class="status-item">
            <div class="status-label">${escapeHtml(k)}</div>
            <div class="status-value">${escapeHtml(v)}</div>
          </div>
        `).join("");
      } catch (err) {
        grid.innerHTML = `<div class="status-item"><div class="status-value">Error loading status</div></div>`;
      }
    }

    document.getElementById("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("error-box");
      const resultsSection = document.getElementById("results-section");
      const resultsMeta = document.getElementById("results-meta");
      const resultsList = document.getElementById("results-list");
      const btn = document.getElementById("search-btn");

      errorBox.style.display = "none";
      const q = document.getElementById("q-input").value.trim();
      if (!q) return;

      const params = new URLSearchParams({
        q,
        mode: document.getElementById("mode-select").value,
        top: document.getElementById("top-input").value || "5",
        rrf_k: document.getElementById("rrf-input").value || "60",
      });

      const pathVal = document.getElementById("path-input").value.trim();
      const globVal = document.getElementById("glob-input").value.trim();
      const sinceVal = document.getElementById("since-input").value.trim();
      const untilVal = document.getElementById("until-input").value.trim();
      if (pathVal) params.set("path", pathVal);
      if (globVal) params.set("glob", globVal);
      if (sinceVal) params.set("since", sinceVal);
      if (untilVal) params.set("until", untilVal);

      btn.disabled = true;
      btn.textContent = "Searching...";

      try {
        const res = await fetch(`/api/query?${params.toString()}`);
        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.detail || "Search failed.";
          errorBox.style.display = "block";
          return;
        }

        resultsSection.style.display = "block";
        resultsMeta.innerHTML = `
          <div>Query: <strong>${escapeHtml(data.query)}</strong> &mdash; <strong>${data.total_hits}</strong> hit(s)</div>
          <div>Elapsed: <strong>${Number(data.execution_time_ms).toFixed(2)} ms</strong></div>
        `;

        if (!data.hits || data.hits.length === 0) {
          resultsList.innerHTML = `<div class="card">No matching chunks found.</div>`;
          return;
        }

        resultsList.innerHTML = data.hits.map((hit, idx) => {
          const snippet = hit.snippet || hit.content || "";
          return `
            <div class="hit-card">
              <div class="hit-header">
                <div class="hit-path">#${idx + 1} ${escapeHtml(hit.file_path)} (chunk #${hit.chunk_index})</div>
                <div class="badges">
                  <span class="badge">RRF: ${Number(hit.rrf_score).toFixed(4)}</span>
                  <span class="badge badge-bm25">BM25: ${hit.bm25_rank !== null ? "#" + hit.bm25_rank : "-"}</span>
                  <span class="badge badge-vec">Vec: ${hit.vec_rank !== null ? "#" + hit.vec_rank : "-"}</span>
                </div>
              </div>
              <div class="hit-content" id="snippet-${idx}">${highlightTerms(snippet, data.query)}</div>
              <div class="hit-content" id="full-${idx}" style="display: none;">${highlightTerms(hit.content, data.query)}</div>
              <div style="margin-top: 8px; text-align: right;">
                <button type="button" class="btn-secondary" onclick="toggleFull(${idx}, this)">Show Full Chunk</button>
              </div>
            </div>
          `;
        }).join("");
      } catch (err) {
        errorBox.textContent = "Network error occurred while querying server.";
        errorBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Search";
      }
    });

    function toggleFull(idx, btnEl) {
      const snip = document.getElementById(`snippet-${idx}`);
      const full = document.getElementById(`full-${idx}`);
      if (full.style.display === "none") {
        full.style.display = "block";
        snip.style.display = "none";
        btnEl.textContent = "Show Snippet";
      } else {
        full.style.display = "none";
        snip.style.display = "block";
        btnEl.textContent = "Show Full Chunk";
      }
    }

    loadStatus();
  </script>
</body>
</html>
