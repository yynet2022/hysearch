[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hysearch"
version = "0.1.0"
description = "Lightweight, zero-daemon local hybrid search engine powered by SQLite and fastembed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "httpx2>=0.1.0",
]
sudachi = [
    "sudachipy>=0.6.8",
    "sudachidict_core>=20240109",
]
sudachi-core = [
    "sudachipy>=0.6.8",
    "sudachidict_core>=20240109",
]
sudachi-small = [
    "sudachipy>=0.6.8",
    "sudachidict_small>=20240109",
]
sudachi-full = [
    "sudachipy>=0.6.8",
    "sudachidict_full>=20240109",
]

[project.scripts]
hysearch = "hysearch.cli.main:app"

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D400", # First line should end with a period (incompatible with Japanese)
    "D415", # First line should end with a period (incompatible with Japanese)
    "RUF001", # Ambiguous characters in docstrings/strings (Japanese punctuation)
    "RUF003", # Ambiguous characters in comments (Japanese comments)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
packages = ["hysearch"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "sqlite_vec.*",
    "fastembed.*",
    "sudachipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --cov=hysearch --cov-report=term-missing"
